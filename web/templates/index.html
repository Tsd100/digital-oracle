<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DO 研判管理中心</title>
  <script>
    (() => {
      const saved = localStorage.getItem("do-timeline-theme");
      const theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="/static/css/management.css">
</head>
<body>
  <header class="management-nav">
    <a class="brand" href="/">DO <span>研判管理中心</span></a>
    <nav aria-label="主要导航">
      <a class="active" href="/">主题总览</a>
      <a href="/timeline">历史时间线</a>
      <a class="primary-link" href="/ask">＋ 发起新分析</a>
      <button id="theme-toggle" type="button" aria-pressed="false"></button>
    </nav>
  </header>

  <main class="management-shell">
    <section id="management-overview" class="overview">
      <div>
        <p class="eyebrow">DIGITAL ORACLE / RESEARCH CONTROL</p>
        <h1>今天的研判，<br><span>哪些发生了变化？</span></h1>
        <p class="lede">集中查看各主题最新判断、相对上次的变化和自动入库状态。</p>
      </div>
      <div id="overview-metrics" class="overview-metrics" aria-live="polite">
        <div class="metric skeleton"></div><div class="metric skeleton"></div><div class="metric skeleton"></div>
      </div>
    </section>

    <section class="section-block">
      <div class="section-heading">
        <div><p class="eyebrow">SUBJECT WATCHLIST</p><h2>主题研判总览</h2></div>
        <div class="view-controls">
          <button class="filter active" data-filter="all" type="button">全部</button>
          <button class="filter" data-filter="changed" type="button">近期变化</button>
          <button class="filter" data-filter="current" type="button">近期更新</button>
        </div>
      </div>
      <div id="subject-grid" class="subject-grid" aria-live="polite"></div>
    </section>

    <section class="lower-grid">
      <article class="panel changes-panel">
        <div class="section-heading"><div><p class="eyebrow">RECENT CHANGES</p><h2>最近判断变化</h2></div></div>
        <div id="recent-changes" class="change-feed"></div>
      </article>
      <aside id="system-health" class="panel health-panel">
        <div class="section-heading"><div><p class="eyebrow">SYSTEM HEALTH</p><h2>入库与数据状态</h2></div></div>
        <div id="health-content" class="health-content"></div>
      </aside>
    </section>
  </main>

  <div id="load-error" class="load-error" hidden>
    <strong>管理数据加载失败</strong><span id="load-error-message"></span><button id="retry" type="button">重新加载</button>
  </div>
  <script src="/static/js/management.js"></script>
</body>
</html>
